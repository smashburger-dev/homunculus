name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Leak guard
        run: python tools/leak_guard.py
      - name: Demo
        run: |
          if python -m homunculus demo --help >/dev/null 2>&1; then
            python -m homunculus demo --out /tmp/demo
          else
            echo "homunculus demo command not available yet, skipping"
          fi
